name: Actualizar precios

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Precios de las tiendas online
        run: npm run datos:online
        continue-on-error: true
      - name: Precios por zona SEPA
        run: npm run datos:sepa
        continue-on-error: true
      - name: Promos de Coto y Dia para revisar
        run: npm run promos:scrape
        continue-on-error: true
      - name: Guardar precios nuevos
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add public/precios public/zonas.json config/promos.generated.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Precios del $(date -u +%F)"
            git push
          fi